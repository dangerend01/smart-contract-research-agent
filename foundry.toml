[profile.default]
src = "src"
test = "tests"
out = "out"
libs = ["lib"]
solc = "0.8.25"
optimizer = true
optimizer_runs = 200

[profile.phase5-unoptimized]
src = "src"
test = "tests"
out = "out/phase5-unoptimized"
libs = ["lib"]
solc = "0.8.25"
