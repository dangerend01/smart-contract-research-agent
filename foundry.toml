optimizer_runs = 0

[profile.phase5-viair]
src = "src"
test = "tests"
out = "out/phase5-viair"
libs = ["lib"]
solc = "0.8.25"
optimizer = true
optimizer_runs = 200
via_ir = true

[fmt]
line_length = 120

